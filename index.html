<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Joseph C. Slater — Talks</title>
  <style>
    :root {
      --bg: #0f1115;
      --card-bg: #1a1d24;
      --card-border: #2a2e37;
      --text: #e8e9ec;
      --muted: #9aa0ab;
      --accent: #5b8def;
      --accent-hover: #7ba4f5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1.5rem;
    }
    header {
      text-align: center;
      margin-bottom: 2.5rem;
      max-width: 640px;
    }
    header h1 {
      font-size: 2rem;
      margin: 0 0 0.5rem;
      letter-spacing: -0.02em;
    }
    header p {
      color: var(--muted);
      margin: 0;
      font-size: 1rem;
    }
    main {
      width: 100%;
      max-width: 720px;
      display: grid;
      gap: 1.25rem;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.5rem 1.75rem;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    .card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .card h2 {
      margin: 0 0 0.25rem;
      font-size: 1.3rem;
    }
    .card h2 a {
      color: var(--text);
      text-decoration: none;
    }
    .card h2 a:hover {
      color: var(--accent-hover);
    }
    .card .date {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 0.9rem;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
    }
    .links a {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.4rem 0.85rem;
      border-radius: 999px;
      font-size: 0.85rem;
      text-decoration: none;
      color: var(--text);
      background: #22262f;
      border: 1px solid var(--card-border);
    }
    .links a.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #0f1115;
      font-weight: 600;
    }
    .links a:hover {
      border-color: var(--accent-hover);
    }
    .links a.primary:hover {
      background: var(--accent-hover);
    }
    footer {
      margin-top: 3rem;
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
    }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>Talks</h1>
    <p>Joseph C. Slater — presentations on leadership and empathy</p>
  </header>

  <main>
    <article class="card">
      <h2><a href="./Empathy%20as%20a%20superpower/leadership.slides.html">Empathy as a Superpower</a></h2>
      <div class="date">April 16, 2026</div>
      <div class="links">
        <a class="primary" href="./Empathy%20as%20a%20superpower/leadership.slides.html">▶ View slides</a>
        <a href="./Empathy%20as%20a%20superpower/leadership.pdf">PDF</a>
        <a href="./Empathy%20as%20a%20superpower/leadership.pptx">PowerPoint</a>
        <a href="./Empathy%20as%20a%20superpower/bibliography.md">Bibliography</a>
      </div>
    </article>
  </main>

  <footer>
    <a href="https://github.com/josephcslater/leadership">Source on GitHub</a>
  </footer>
</body>
</html>
